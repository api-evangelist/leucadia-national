description: >-
  Leucadia National Corporation was a diversified holding company engaged in a
  variety of businesses, including investment banking, beef processing,
  manufacturing, telecommunications, and real estate. In 2018 it was renamed
  Jefferies Financial Group following the merger with Jefferies Group LLC.
